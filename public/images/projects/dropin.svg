<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Glowing Mesh Orbs -->
  <circle cx="680" cy="80" r="180" fill="#ec4899" opacity="0.25" filter="url(#blurGlow)"/>
  <circle cx="120" cy="380" r="160" fill="#8b5cf6" opacity="0.2" filter="url(#blurGlow)"/>
  <circle cx="400" cy="225" r="220" fill="#3b82f6" opacity="0.12" filter="url(#blurGlow)"/>

  <!-- Decorative Grid Lines -->
  <path d="M0 75 H800 M0 150 H800 M0 225 H800 M0 300 H800 M0 375 H800" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Main Card Container -->
  <rect x="25" y="25" width="750" height="400" rx="24" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top App Window Bar -->
  <g transform="translate(45, 45)">
    <circle cx="10" cy="10" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="30" cy="10" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="50" cy="10" r="6" fill="#10b981" opacity="0.8"/>
    
    <!-- Badge -->
    <rect x="520" y="0" width="165" height="24" rx="12" fill="url(#glowGrad)" opacity="0.9"/>
    <text x="602" y="16" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="1" text-anchor="middle">REALTIME SOCIAL</text>
  </g>

  <!-- Project Title & Subtitle -->
  <g transform="translate(45, 120)">
    <text x="0" y="30" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">DropIn - Spatial Hangout Space</text>
    <text x="0" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="500">Spatial Proximity Radar, WebRTC Audio & Venues</text>
  </g>

  <!-- Visual Accent Line -->
  <line x1="45" y1="220" x2="735" y2="220" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Tech Stack Pills -->
  
        <g transform="translate(40, 260)">
          <rect width="110" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <text x="55.0" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Next.js 14</text>
        </g>
        
        <g transform="translate(160, 260)">
          <rect width="74" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <text x="37.0" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">WebRTC</text>
        </g>
        
        <g transform="translate(244, 260)">
          <rect width="83" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <text x="41.5" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">MongoDB</text>
        </g>
        
        <g transform="translate(337, 260)">
          <rect width="92" height="28" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
          <text x="46.0" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Tailwind</text>
        </g>
        

  <!-- Footer Link Hint -->
  <g transform="translate(45, 380)">
    <rect width="130" height="32" rx="10" fill="url(#glowGrad)"/>
    <text x="65" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Live Preview ↗</text>
  </g>
</svg>